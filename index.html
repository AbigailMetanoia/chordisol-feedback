<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="a/logo.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Chordisol Feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one sky stage. A soft cloud bank anchors the bottom; the stroked title sits between two music notes; below it a tidy 5-column wall of tilted notes. Compose and thank-you are full-screen layers over the same sky. Single committed light look, matching the app. */
:root{
  --sky:#A8D8FD; --sky-low:#C4E4FE;
  --blue:#2391FF; --blue-press:#0E6FD6;
  --note:#55BBF8; --note-edge:#2E9BEA;
  --orange:#FF9F2E; --orange-edge:#E5810C;
  --pink:#FF6BAE; --pink-edge:#E44C92;
  --halo:#E6F3FF; --ink:#1A1A1A; --muted:#3B5A78; --paper:#FFFFFF;
  --display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:linear-gradient(180deg,var(--sky) 0%,var(--sky) 55%,var(--sky-low) 100%);color:var(--ink);font-family:var(--body);overflow-x:hidden}

/* backdrop */
.clouds{position:fixed;left:0;right:0;bottom:0;height:68vh;pointer-events:none;z-index:0;
  background:url(a/cloud.svg) center top/cover no-repeat}
.twinkle{position:absolute;pointer-events:none;animation:twinkle 3.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.7) rotate(20deg);opacity:.7}}
.bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--rot,0deg))}50%{transform:translateY(-8px) rotate(var(--rot,0deg))}}

.stage{position:relative;z-index:1;min-height:100vh;padding-block:56px 96px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto;position:relative}

/* title with halo outline */
.head{position:relative;text-align:center}
.title{position:relative;isolation:isolate;display:inline-block;margin:0;font:700 clamp(40px,6.2vw,92px)/1.02 var(--display);color:var(--blue);letter-spacing:-.005em;text-wrap:balance}
.title::before{content:attr(data-text);position:absolute;inset:0;z-index:-1;color:var(--halo);-webkit-text-stroke:clamp(8px,1.1vw,16px) var(--halo);filter:drop-shadow(0 6px 14px rgba(35,145,255,.18))}
.sub{margin:18px 0 0;font:700 clamp(17px,1.7vw,24px)/1.3 var(--body);color:var(--ink)}
.head .n-pink{position:absolute;left:2%;top:-30px;width:clamp(48px,6vw,84px);--rot:-6deg}
.head .n-blue{position:absolute;right:2%;top:10px;width:clamp(52px,6.4vw,92px);--rot:8deg;animation-delay:-1.6s}
.count{display:inline-flex;margin-top:16px;font:600 14px var(--display);color:var(--blue);background:rgba(255,255,255,.75);padding:6px 14px;border-radius:999px;font-variant-numeric:tabular-nums}
.count.warn{color:#8a4b00;background:#FFF1D6}

/* wall */
.wall{list-style:none;margin:56px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(28px,3.4vw,52px) clamp(22px,2.6vw,40px)}
.wall li{position:relative;min-width:0}
.card{position:relative;width:100%;aspect-ratio:1/1;border-radius:clamp(18px,2vw,28px);background:var(--note);box-shadow:0 6px 0 var(--note-edge),0 18px 28px -10px rgba(20,100,180,.35);color:#fff;
  display:flex;align-items:center;padding:clamp(16px,1.8vw,26px);transform:rotate(var(--r,0deg));transition:transform .3s cubic-bezier(.2,1.3,.4,1)}
.card:hover{transform:rotate(0deg) translateY(-4px)}
.card p{margin:0;font:600 clamp(16px,1.45vw,21px)/1.28 var(--display);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.card.c1{background:var(--orange);box-shadow:0 6px 0 var(--orange-edge),0 18px 28px -10px rgba(190,110,20,.35)}
.card.c2{background:var(--pink);box-shadow:0 6px 0 var(--pink-edge),0 18px 28px -10px rgba(200,50,120,.35)}
.card .when{position:absolute;left:clamp(16px,1.8vw,26px);bottom:12px;font:700 12px var(--body);opacity:.85}
.card .spark{position:absolute;width:clamp(30px,3vw,44px);pointer-events:none}
.spark.tr{right:-14px;top:-16px}.spark.bl{left:-14px;bottom:-18px}
.add{cursor:pointer;border:0;justify-content:center;background:var(--note)}
.add svg{width:42%}
.add .lbl{position:absolute;bottom:14px;left:0;right:0;text-align:center;font:600 15px var(--display);opacity:.9}
.add:hover{transform:rotate(0) scale(1.04)}
.del{position:absolute;right:10px;top:10px;border:0;background:rgba(0,0,0,.18);color:#fff;border-radius:999px;font:700 12px var(--body);padding:5px 10px;cursor:pointer;opacity:0;transition:opacity .2s}
.card:hover .del,.del:focus-visible,.del.armed{opacity:1}
.del.armed{background:#D92D20}
.fresh{animation:land .8s cubic-bezier(.2,1.5,.4,1)}
@keyframes land{0%{transform:rotate(calc(var(--r) - 20deg)) scale(.2);opacity:0}70%{opacity:1}100%{transform:rotate(var(--r)) scale(1)}}
.empty{grid-column:2/-1;align-self:center;font:600 20px/1.35 var(--display);color:var(--muted)}

:focus-visible{outline:4px solid #CB30E0;outline-offset:4px}

/* layers */
.layer{position:fixed;inset:0;z-index:20;overflow-y:auto;background:rgba(168,216,253,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:max(32px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
.layer .clouds{z-index:0}
.inner{position:relative;z-index:1;min-height:100%;display:grid;place-items:center;align-content:center;gap:28px}

/* compose */
.compose{width:min(620px,100%);display:grid;gap:22px;justify-items:center}
.ctitle{font-size:clamp(30px,4vw,52px)}
.pad{position:relative;width:100%;background:var(--note);border-radius:30px;box-shadow:0 8px 0 var(--note-edge),0 26px 40px -12px rgba(20,100,180,.4);padding:30px 30px 18px;transform:rotate(-2deg);transition:background .25s,box-shadow .25s}
.pad.c1{background:var(--orange);box-shadow:0 8px 0 var(--orange-edge),0 26px 40px -12px rgba(190,110,20,.4)}
.pad.c2{background:var(--pink);box-shadow:0 8px 0 var(--pink-edge),0 26px 40px -12px rgba(200,50,120,.4)}
.pad textarea{display:block;width:100%;min-height:210px;border:0;resize:none;background:transparent;color:#fff;font:600 clamp(22px,2.4vw,28px)/1.3 var(--display);outline:none}
.pad textarea::placeholder{color:rgba(255,255,255,.7)}
.pad .foot{display:flex;justify-content:space-between;align-items:center;color:#fff;font:700 13px var(--body);font-variant-numeric:tabular-nums}
.pad .spark{position:absolute;right:-18px;top:-20px;width:48px}
.swatches{display:flex;gap:8px}
.swatches button{width:26px;height:26px;border-radius:9px;border:3px solid rgba(255,255,255,.55);cursor:pointer}
.swatches button[aria-pressed="true"]{border-color:#fff;transform:scale(1.15)}
.actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.btn{font:600 19px var(--display);border:0;border-radius:999px;padding:15px 32px;cursor:pointer;background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-press);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-press)}
.btn.ghost{background:#fff;color:var(--blue);box-shadow:0 5px 0 #A9CDEF}
.btn[disabled]{opacity:.55;cursor:wait}
.err{margin:0;color:#9B1C0C;font-weight:800;text-align:center}
.pad.fly{animation:fly .7s cubic-bezier(.5,-0.4,.7,.2) forwards}
@keyframes fly{0%{transform:rotate(-2deg) scale(1)}25%{transform:rotate(3deg) scale(1.06)}100%{transform:rotate(18deg) translateY(-70vh) scale(.25);opacity:0}}

/* thanks */
.thanks{width:min(1040px,100%);display:grid;gap:30px;justify-items:center}
.ttitle{font-size:clamp(38px,5.6vw,84px)}
.show .ttitle{animation:popin .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes popin{0%{transform:scale(.4) translateY(30px);opacity:0}100%{transform:none;opacity:1}}
.tcard{position:relative;width:100%;background:var(--paper);border-radius:clamp(28px,3vw,44px);padding:clamp(24px,3.4vw,44px);display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,3vw,44px);align-items:center;box-shadow:0 30px 60px -20px rgba(20,100,180,.35)}
.show .tcard{animation:rise .7s .15s cubic-bezier(.2,1.2,.4,1) both}
@keyframes rise{0%{transform:translateY(60px) scale(.94);opacity:0}100%{transform:none;opacity:1}}
.tcard .spark{position:absolute;width:52px}
.tcard .s1{left:-20px;top:-22px}.tcard .s2{right:30%;bottom:-24px;width:38px}
.show .tcard .spark{animation:sparkpop .6s .7s cubic-bezier(.2,1.8,.4,1) both}
@keyframes sparkpop{0%{transform:scale(0) rotate(-60deg)}100%{transform:none}}
.brand{display:grid;justify-items:center;gap:18px}
.brand .logo{width:min(250px,62%)}
.brand .word{width:min(300px,80%)}
.store{display:inline-flex;align-items:center;gap:10px;background:#000;color:#fff;border-radius:14px;padding:9px 22px 10px;border:1.5px solid #A6A6A6}
.store svg{width:26px;height:30px;fill:#fff}
.store span{display:grid;line-height:1}
.store small{font:600 12px -apple-system,var(--body);letter-spacing:.02em}
.store b{font:600 26px -apple-system,var(--body);letter-spacing:-.01em}
.qr{background:#F9F8F3;border-radius:26px;padding:clamp(14px,2vw,22px);display:grid;justify-items:center;gap:10px}
.qr img{width:100%;max-width:360px;aspect-ratio:1/1;border-radius:12px}
.qr span{font:600 16px var(--display);color:#2E6BC0}
.below{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.timer{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.clap{position:fixed;right:max(8px,env(safe-area-inset-right,0px));bottom:0;width:clamp(170px,27vw,400px);aspect-ratio:1/1;z-index:2;pointer-events:none}
.show .clap{animation:peek .8s .35s cubic-bezier(.2,1.3,.4,1) both}
@keyframes peek{0%{transform:translate(40%,60%) rotate(20deg)}100%{transform:none}}

/* burst particles */
.particle{position:fixed;left:0;top:0;z-index:40;pointer-events:none;will-change:transform,opacity}
.mute{position:fixed;z-index:30;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;background:rgba(255,255,255,.85);color:var(--blue);display:grid;place-items:center;box-shadow:0 4px 0 #A9CDEF}
.mute svg{width:24px;height:24px}
.mute[aria-pressed="true"]{color:var(--muted)}

@media (max-width:1100px){.wall{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:860px){.wall{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){
  .wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 20px}
  .head .n-pink{top:-34px;left:-4px}.head .n-blue{top:-26px;right:-4px}
  .tcard{grid-template-columns:1fr}
  .thanks{padding-bottom:120px}
  .empty{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>

<div class="clouds" aria-hidden="true"></div>

<button class="mute" id="mute" type="button" aria-pressed="false" aria-label="Turn sound off">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><g class="waves"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></g><g class="x" style="display:none"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg>
</button>

<main class="stage">
  <div class="wrap">
    <header class="head">
      <img class="n-pink bob" src="a/note-pink.svg" alt="" aria-hidden="true">
      <img class="n-blue bob" src="a/note-blue.svg" alt="" aria-hidden="true">
      <img class="twinkle" src="a/star.svg" alt="" aria-hidden="true" style="left:18%;top:96%;width:18px">
      <img class="twinkle" src="a/star2.svg" alt="" aria-hidden="true" style="right:20%;top:-14px;width:16px;animation-delay:-1.2s">
      <h1 class="title" data-text="Give Us Your Feedback!">Give Us Your Feedback!</h1>
      <p class="sub">Type your thoughts here.</p>
      <span class="count" id="count">Loading notes…</span>
    </header>

    <ul class="wall" id="wall" aria-live="polite">
      <li><button class="card add" id="addBtn" aria-label="Write a feedback note" style="--r:-4deg">
        <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 16v68M16 50h68" stroke="#fff" stroke-width="9" stroke-linecap="round"/></svg>
        <span class="lbl">Write a note</span>
      </button></li>
    </ul>
  </div>
</main>

<!-- COMPOSE -->
<div class="layer" id="composeView" hidden role="dialog" aria-modal="true" aria-labelledby="composeTitle">
  <div class="clouds" aria-hidden="true"></div>
  <div class="inner">
    <form class="compose" id="form" novalidate>
      <h2 class="title ctitle" id="composeTitle" data-text="What do you think?">What do you think?</h2>
      <div class="pad" id="pad">
        <img class="spark" src="a/sparkle.svg" alt="" aria-hidden="true">
                <textarea id="text" aria-label="Your feedback" maxlength="220" placeholder="Your app is great! I hope there's a guitar version…"></textarea>
        <div class="foot">
          <div class="swatches" role="group" aria-label="Note color">
            <button type="button" data-c="0" aria-pressed="true" style="background:#55BBF8" aria-label="Blue note"></button>
            <button type="button" data-c="1" aria-pressed="false" style="background:#FF9F2E" aria-label="Orange note"></button>
            <button type="button" data-c="2" aria-pressed="false" style="background:#FF6BAE" aria-label="Pink note"></button>
          </div>
          <span id="chars">0 / 220</span>
        </div>
      </div>
      <p class="err" id="err" hidden></p>
      <div class="actions">
        <button type="button" class="btn ghost" id="cancel">Cancel</button>
        <button type="submit" class="btn" id="send">Stick it on the wall</button>
      </div>
    </form>
  </div>
</div>

<!-- THANKS -->
<div class="layer" id="thanksView" hidden role="dialog" aria-modal="true" aria-labelledby="thanksTitle">
  <div class="clouds" aria-hidden="true"></div>
  <div class="inner">
    <div class="thanks">
      <h2 class="title ttitle" id="thanksTitle" data-text="Thank You So Much!">Thank You So Much!</h2>
      <div class="tcard">
        <img class="spark s1" src="a/sparkle.svg" alt="" aria-hidden="true">
        <img class="spark s2" src="a/sparkle.svg" alt="" aria-hidden="true">
        <div class="brand">
          <img class="logo" src="a/logo.svg" alt="Chordisol app icon">
          <img class="word" src="a/wordmark.svg" alt="chordisol">
          <div class="store" role="img" aria-label="Download on the App Store">
            <svg viewBox="0 0 384 512" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
            <span><small>Download on the</small><b>App Store</b></span>
          </div>
        </div>
        <div class="qr">
          <img src="a/qr.png" alt="QR code to download Chordisol">
          <span>Scan to download Chordisol</span>
        </div>
      </div>
      <div class="below">
        <button class="btn" id="back">Back to the wall</button>
        <span class="timer" id="timer"></span>
      </div>
    </div>
  </div>
  <div class="clap" id="clapAnim" aria-hidden="true"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const wall = $("wall");
  const TILT = [-8, 8, -1, 4, -6, -9, 9, 0, 5, -3];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let db = null, isOwner = false, color = 0, seen = new Set(), first = true, pendingFresh = null, clap = null;

  function hash(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
  function ago(ms) {
    if (!ms) return "";
    const m = Math.round((Date.now() - ms) / 60000);
    if (m < 1) return "just now"; if (m < 60) return m + " min ago";
    const h = Math.round(m / 60); if (h < 24) return h + " h ago";
    return new Date(ms).toLocaleDateString(undefined, { day: "numeric", month: "short" });
  }
  function setCount(text, warn) { const c = $("count"); c.textContent = text; c.classList.toggle("warn", !!warn); }

  function render(docs) {
    [...wall.children].slice(1).forEach(n => n.remove());
    setCount(docs.length === 1 ? "1 note on the wall" : docs.length + " notes on the wall");
    if (!docs.length) {
      const li = document.createElement("li"); li.className = "empty";
      li.textContent = "No notes yet. Be the first to tell us what you think!";
      wall.append(li); return;
    }
    docs.forEach((d, i) => {
      const v = d.data() || {};
      const li = document.createElement("li");
      const card = document.createElement("div");
      const c = [0, 1, 2].includes(v.color) ? v.color : 0;
      card.className = "card" + (c ? " c" + c : "");
      card.style.setProperty("--r", TILT[(i + 1) % TILT.length] + "deg");
      const p = document.createElement("p"); p.textContent = String(v.text || "");
      const when = document.createElement("span"); when.className = "when"; when.textContent = ago(v.createdAt);
      card.append(p, when);
      const h = hash(d.id);
      if (h % 5 === 0) { const s = document.createElement("img"); s.src = "a/sparkle.svg"; s.alt = ""; s.className = "spark " + (h % 2 ? "tr" : "bl"); card.append(s); }
      if (isOwner) {
        const b = document.createElement("button"); b.className = "del"; b.type = "button"; b.textContent = "Remove";
        b.addEventListener("click", async () => {
          if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Tap again to remove"; setTimeout(() => { b.classList.remove("armed"); b.textContent = "Remove"; }, 3000); return; }
          b.disabled = true; sfx.remove();
          try { await db.collection("notes").doc(d.id).delete(); } catch (e) { b.disabled = false; b.textContent = "Couldn't remove"; }
        });
        card.append(b);
      }
      if (!first && !seen.has(d.id) && d.id === pendingFresh && $("thanksView").hidden) { card.classList.add("fresh"); pendingFresh = null; }
      li.append(card); wall.append(li); seen.add(d.id);
    });
    first = false;
  }

  // Minimal stand-in for the claude.ai db, backed by localStorage (one device only).
  function localNotes() {
    const KEY = "chordisol-notes", subs = new Set();
    const read = () => { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { return []; } };
    const write = list => { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) { throw { code: "unavailable" }; } emit(); };
    const snap = () => { const docs = read().sort((a, b) => b.createdAt - a.createdAt).map(n => ({ id: n.id, data: () => n }));
      return { docs, size: docs.length, empty: !docs.length, metadata: { fromCache: false, hasPendingWrites: false } }; };
    const emit = () => subs.forEach(fn => fn(snap()));
    addEventListener("storage", e => { if (e.key === KEY) emit(); });
    const col = {
      orderBy: () => col, limit: () => col,
      onSnapshot(next) { subs.add(next); setTimeout(() => next(snap())); return () => subs.delete(next); },
      async add(data) { const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7); write([...read(), { id, ...data }]); return { id }; },
      doc: id => ({ async delete() { write(read().filter(n => n.id !== id)); } })
    };
    return { collection: () => col };
  }

  // Data
  (async () => {
    const timer = setTimeout(() => setCount("Notes can't be reached yet", true), 10000);
    if (!window.claude?.use) {
      // Standalone hosting (GitHub Pages, local file): keep notes in this browser.
      clearTimeout(timer); db = localNotes(); isOwner = true;
    } else {
      db = await (window.claude.use("db") ?? null);
      const user = await (window.claude.use("user") ?? null);
      isOwner = (await user?.isOwner?.()) ?? false;
    }
    if (!db) { clearTimeout(timer); setCount("Sign in to claude.ai to see and post notes", true); render([]); setCount("Sign in to claude.ai to see and post notes", true); return; }
    db.collection("notes").orderBy("createdAt", "desc").limit(500).onSnapshot(snap => {
      if (!snap.metadata.fromCache) clearTimeout(timer);
      render(snap.docs);
    }, () => { clearTimeout(timer); setCount("Couldn't load notes", true); });
  })();

  // ── Sound: Web Audio synth, same palette as the exhibition app (bells, bloops, whoosh, claps) ──
  const sfx = (() => {
    let ac = null, out = null, noiseBuf = null, muted = false;
    try { muted = localStorage.getItem("chordisol-muted") === "1"; } catch (e) {}
    const freq = m => 440 * 2 ** ((m - 69) / 12);
    const BELL = [["sine", 1, 1], ["sine", 2.01, .3], ["sine", 3.98, .12]];
    const BRASS = [["sawtooth", 1, .5], ["square", 1.003, .2], ["sine", 2, .3]];
    const BASS = [["sine", 1, 1], ["triangle", 2, .25]];
    function ctx() {
      if (muted) return null;
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
        ac = new AC(); out = ac.createGain(); out.gain.value = .8; out.connect(ac.destination);
      }
      if (ac.state === "suspended") ac.resume().catch(() => {});
      return ac;
    }
    function noise() {
      if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
      return noiseBuf;
    }
    function note(dest, midi, t, dur, vol, parts = BELL, attack = .004) {
      const env = ac.createGain();
      env.gain.setValueAtTime(0, t); env.gain.linearRampToValueAtTime(vol, t + attack);
      env.gain.exponentialRampToValueAtTime(.0008, t + dur); env.connect(dest);
      for (const [type, mult, g] of parts) { const o = ac.createOscillator(), gg = ac.createGain(); o.type = type; o.frequency.value = freq(midi) * mult; gg.gain.value = g; o.connect(gg).connect(env); o.start(t); o.stop(t + dur + .05); }
    }
    function blip(t, from, to, dur, vol, type = "sine") {
      const o = ac.createOscillator(), g = ac.createGain(); o.type = type;
      o.frequency.setValueAtTime(from, t); o.frequency.exponentialRampToValueAtTime(to, t + dur * .5);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .004); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g).connect(out); o.start(t); o.stop(t + dur + .02);
    }
    function sweep(t, from, to, dur, vol) {
      const s = ac.createBufferSource(); s.buffer = noise();
      const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.2;
      bp.frequency.setValueAtTime(from, t); bp.frequency.exponentialRampToValueAtTime(to, t + dur * .8);
      const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + dur * .25); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      s.connect(bp).connect(g).connect(out); s.start(t); s.stop(t + dur + .02);
    }
    function hit(t, vol, decay, type, f) {
      const s = ac.createBufferSource(); s.buffer = noise();
      const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f;
      const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + decay);
      s.connect(fl).connect(g).connect(out); s.start(t); s.stop(t + decay + .02);
    }
    function clap(t) { for (let k = 0; k < 3; k++) hit(t + k * .012, .16, .09, "bandpass", 1400 + Math.random() * 400); }
    const bloop = (t, m, vol = .3) => { blip(t, freq(m - 7), freq(m), .16, vol); blip(t + .005, freq(m + 12), freq(m + 19), .06, vol * .25, "triangle"); };
    const sparkle = (t, base = 84, vol = .08) => [0, 4, 7, 12, 16].forEach((d, i) => note(out, base + d, t + i * .035, .4, vol));
    const play = fn => { const a = ctx(); if (a) try { fn(a.currentTime + .01); } catch (e) {} };
    return {
      get muted() { return muted; },
      setMuted(v) { muted = v; try { localStorage.setItem("chordisol-muted", v ? "1" : "0"); } catch (e) {} if (v && ac) ac.suspend().catch(() => {}); },
      open: () => play(t => { bloop(t, 72); sparkle(t + .08, 88, .05); }),
      close: () => play(t => blip(t, 520, 300, .14, .18, "triangle")),
      tap: (i = 0) => play(t => blip(t, freq(84 + i * 3), freq(79 + i * 3), .09, .2, "triangle")),
      oops: () => play(t => { blip(t, 220, 110, .18, .32); blip(t + .14, 180, 90, .2, .26); }),
      remove: () => play(t => { blip(t, 400, 120, .22, .25); sweep(t, 2200, 500, .3, .2); }),
      send: () => play(t => {
        bloop(t, 60, .38);
        sweep(t + .08, 450, 3400, .6, .32);
        [72, 76, 79, 84].forEach((m, i) => note(out, m, t + .22 + i * .075, i === 3 ? .8 : .3, i === 3 ? .24 : .16));
        sparkle(t + .55, 91, .06);
      }),
      thanks: () => play(t => {
        const soft = ac.createBiquadFilter(); soft.type = "lowpass"; soft.frequency.value = 2400; soft.connect(out);
        [67, 71, 74].forEach(m => note(soft, m, t, .14, .09, BRASS, .03));
        [72, 76, 79, 84].forEach(m => note(soft, m, t + .16, 1.2, .09, BRASS, .03));
        note(out, 48, t + .16, 1.2, .28, BASS, .008);
        hit(t + .16, .2, 1.5, "highpass", 5000);
        [84, 86, 88, 91, 93, 96, 98, 100].forEach((m, i) => note(out, m, t + .22 + i * .045, .5, .05));
        for (let k = 0; k < 10; k++) clap(t + .4 + k * .11 + Math.random() * .04);
        bloop(t + .9, 76, .22); sparkle(t + 1.4, 84, .05);
      }),
      land: () => play(t => { sweep(t, 3000, 600, .35, .2); bloop(t + .45, 79, .32); sparkle(t + .55, 84, .06); })
    };
  })();
  const muteBtn = $("mute");
  function paintMute() { muteBtn.setAttribute("aria-pressed", sfx.muted); muteBtn.setAttribute("aria-label", sfx.muted ? "Turn sound on" : "Turn sound off"); muteBtn.querySelector(".waves").style.display = sfx.muted ? "none" : ""; muteBtn.querySelector(".x").style.display = sfx.muted ? "" : "none"; }
  muteBtn.addEventListener("click", () => { sfx.setMuted(!sfx.muted); paintMute(); if (!sfx.muted) sfx.tap(2); });
  paintMute();

  // Compose
  const text = $("text"), pad = $("pad");
  function openCompose() { sfx.open(); $("composeView").hidden = false; $("err").hidden = true; pad.classList.remove("fly"); setTimeout(() => text.focus(), 50); }
  function closeCompose() { sfx.close(); $("composeView").hidden = true; $("addBtn").focus(); }
  $("addBtn").addEventListener("click", openCompose);
  $("cancel").addEventListener("click", closeCompose);
  text.addEventListener("input", () => { $("chars").textContent = text.value.length + " / 220"; });
  document.querySelectorAll(".swatches button").forEach(b => b.addEventListener("click", () => {
    color = +b.dataset.c; sfx.tap(color);
    document.querySelectorAll(".swatches button").forEach(x => x.setAttribute("aria-pressed", x === b));
    pad.classList.remove("c1", "c2"); if (color) pad.classList.add("c" + color);
  }));
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (!$("composeView").hidden) closeCompose(); else if (!$("thanksView").hidden) closeThanks();
  });

  // Burst of stars and notes from a point
  const PIECES = ["a/sparkle.svg", "a/star.svg", "a/star2.svg", "a/note-pink.svg", "a/note-blue.svg", "a/sparkle.svg"];
  function burst(x, y, n = 26) {
    if (reduce) return;
    for (let i = 0; i < n; i++) {
      const img = document.createElement("img");
      img.src = PIECES[i % PIECES.length]; img.alt = ""; img.className = "particle";
      const size = 18 + Math.random() * 34; img.style.width = size + "px";
      document.body.append(img);
      const a = (Math.PI * 2 * i) / n + Math.random() * .4;
      const dist = 140 + Math.random() * Math.min(innerWidth, 900) * .38;
      const dx = Math.cos(a) * dist, dy = Math.sin(a) * dist;
      const rot = (Math.random() - .5) * 540;
      img.animate([
        { transform: `translate(${x - size / 2}px,${y - size / 2}px) scale(.2) rotate(0deg)`, opacity: 1 },
        { transform: `translate(${x + dx * .8 - size / 2}px,${y + dy * .8 - size / 2}px) scale(1.15) rotate(${rot * .7}deg)`, opacity: 1, offset: .55 },
        { transform: `translate(${x + dx - size / 2}px,${y + dy + 90 - size / 2}px) scale(.8) rotate(${rot}deg)`, opacity: 0 }
      ], { duration: 1100 + Math.random() * 500, easing: "cubic-bezier(.15,.7,.3,1)", fill: "forwards" }).onfinish = () => img.remove();
    }
  }

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const val = text.value.trim();
    const err = $("err");
    if (!val) { sfx.oops(); err.textContent = "Write something first. Even one sentence helps!"; err.hidden = false; text.focus(); return; }
    if (!db) { sfx.oops(); err.textContent = "This view can't save notes. Open the page on claude.ai while signed in."; err.hidden = false; return; }
    $("send").disabled = true; $("send").textContent = "Sticking…"; err.hidden = true;
    try {
      const ref = await db.collection("notes").add({ text: val.slice(0, 220), color, createdAt: Date.now() });
      pendingFresh = ref.id;
      const r = pad.getBoundingClientRect();
      pad.classList.add("fly"); sfx.send();
      setTimeout(() => burst(r.left + r.width / 2, r.top + r.height / 2), reduce ? 0 : 200);
      setTimeout(() => {
        $("composeView").hidden = true; pad.classList.remove("fly");
        text.value = ""; $("chars").textContent = "0 / 220";
        openThanks();
      }, reduce ? 0 : 720);
    } catch (er) {
      err.textContent = er?.code === "quota_exceeded" ? "The wall is full. Ask the owner to remove some old notes."
        : er?.code === "invalid_argument" ? "You don't have permission to post on this wall."
        : "Your note didn't save. Check the connection and try again.";
      err.hidden = false; sfx.oops();
    } finally { $("send").disabled = false; $("send").textContent = "Stick it on the wall"; }
  });

  // Thanks
  let tick = null;
  function openThanks() {
    const v = $("thanksView");
    v.classList.remove("show"); v.hidden = false; void v.offsetWidth; v.classList.add("show");
    $("back").focus(); sfx.thanks();
    try {
      if (!clap && window.lottie) clap = lottie.loadAnimation({ container: $("clapAnim"), renderer: "svg", loop: true, autoplay: true, path: "a/clap.json" });
      else clap?.goToAndPlay(0, true);
    } catch (e) {}
    setTimeout(() => { const t = $("thanksTitle").getBoundingClientRect(); burst(t.left + t.width / 2, t.top + t.height / 2, 18); }, reduce ? 0 : 350);
    let s = 20; $("timer").textContent = "Back to the wall in " + s + "s";
    clearInterval(tick);
    tick = setInterval(() => { s--; $("timer").textContent = "Back to the wall in " + s + "s"; if (s <= 0) closeThanks(); }, 1000);
  }
  function closeThanks() {
    clearInterval(tick); $("thanksView").hidden = true; $("thanksView").classList.remove("show"); clap?.pause();
    // Pop the new note onto the wall
    const firstCard = wall.children[1]?.querySelector(".card");
    if (firstCard && pendingFresh) { sfx.land(); firstCard.classList.remove("fresh"); void firstCard.offsetWidth; firstCard.classList.add("fresh");
      const r = firstCard.getBoundingClientRect(); setTimeout(() => burst(r.left + r.width / 2, r.top + r.height / 2, 14), 500); pendingFresh = null; }
    $("addBtn").focus();
  }
  $("back").addEventListener("click", closeThanks);
})();
</script>

</body>
